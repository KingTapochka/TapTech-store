stages:
  - test
  - build
  - scan
  - deploy

test:
  stage: test
  image: python:3.12-slim
  services:
    - name: postgres:16
      alias: postgres
    - name: redis:7
      alias: redis
  variables:
    POSTGRES_DB: shop_test
    POSTGRES_USER: shop_user
    POSTGRES_PASSWORD: test_password
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_NAME: shop_test
    DB_USER: shop_user
    DB_PASSWORD: test_password
    REDIS_URL: redis://redis:6379/0
  before_script:
    - cd backend
    - pip install --no-cache-dir -r requirements.txt
  script:
    - alembic upgrade head
    - pytest -v

build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -t "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA" backend
    - docker push "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_TAG"
        docker push "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_TAG"
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

scan:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
    TRIVE_NO_PROGRESS: "true"
    TRIVY_CACHE_DIR: .trivyccache/
    IMAGE: $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA
  script:
    - trivy image --cache-dir .trivycache --scanners vuln --exit-code 0 --severity HIGH,CRITICAL "$IMAGE"
    - trivy image --cache-dir .trivycache --scanners vuln --exit-code 1 --severity CRITICAL --ignore-unfixed "$IMAGE"
  cache:
    paths:
      - .trivycache/
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

deploy:
  stage: deploy
  image: alpine:3.20
  before_script:
    - apk add --no-cache apenssh-client
    - chmod 600 "$SSH_PRIVATE_KEY"
    - mkdir -p ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
  script:
    - ssh -i "$SSH_PRIVATE_KEY" "$DEPLOY_USER@$DEPLOY_HOST" "$CI_COMMIT_TAG"
  environment:
    name: production
    url: https://tatptech24.ru
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
