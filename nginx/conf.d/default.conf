server {
    listen 80;
    server_name tatptech24.ru www.tatptech24.ru;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 443 ssl;
    http2 on;
    server_name tatptech24.ru www.tatptech24.ru;

    ssl_certificate /etc/letsencrypt/live/tatptech24.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tatptech24.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    resolver 127.0.0.11 valid=10s;

    location / {
       set $upstream http://backend:8000;
       proxy_pass $upstream;
       proxy_set_header Host $host;
       proxy_set_header X-Real-IP $remote_addr;
       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
       proxy_set_header X-Forwarded-Proto $scheme;
    }
}
